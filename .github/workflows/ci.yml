name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone upstream OpenFX SDK (OFX_Release_1_4_TAG)
        shell: bash
        run: |
          git clone --depth 1 --branch OFX_Release_1_4_TAG https://github.com/AcademySoftwareFoundation/openfx.git openfx-sdk

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOFX_ROOT=${{ github.workspace }}/openfx-sdk

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --config Release -j2

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DOFX_ROOT=${{ github.workspace }}/openfx-sdk

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release -- /m:2

      - name: Run tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/Release/DGSmoke.exe
            ./build/Release/DGHostCheck.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ./build/DGSmoke
            ./build/DGHostCheck
          else
            ./build/DGSmoke
            ./build/DGHostCheck
          fi

      - name: Upload plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: DeepGlow2-${{ matrix.os }}
          path: |
            build/bundle/DeepGlow2.ofx.bundle
            build/Release/*.ofx.bundle
            build/*.ofx.bundle
          if-no-files-found: ignore
          retention-days: 7
